[package]
name = "kurag"
version = "0.4.1"
description = "Retrieval server for RAG: vector, full-text and hybrid search, a similarity graph and a knowledge graph"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["ui"]
# the graph view, built into the binary and served at /ui
ui = []

[dependencies]
kurag-core = { path = "../kurag-core" }
axum = "0.8"
base64 = "0.22"
half = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
